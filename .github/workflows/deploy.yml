name: Cloudflare Edge Auto CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '01_LIVE_SMART_PORTAL_APP/**'
      - 'raipur_cloudflare_backend/**'
      - 'raipur_registry_rates_2025_2026.json'
      - 'deploy_to_cloudflare.py'
      - 'create_sqlite_db.py'
      - 'partition_datasets.py'
      - 'reconcile_and_normalize.py'
      - 'sync_to_d1.py'
      - 'sync_batch_d1.py'
      - 'upload_raw_to_r2.py'
      - 'check_deploy_syntax.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy only after D1 backup, reviewed migrations, full-load counts, and TOKEN_SECRET are ready.'
        required: true
        type: boolean
        default: false

jobs:
  deploy-to-cloudflare:
    name: Validate and optionally deploy Raipur Land Hub
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🟩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔍 Verify Python Code Syntax
        run: |
          python -m py_compile deploy_to_cloudflare.py check_deploy_syntax.py create_sqlite_db.py partition_datasets.py sync_to_d1.py sync_batch_d1.py upload_raw_to_r2.py
          python check_deploy_syntax.py
          node --input-type=module --check < raipur_cloudflare_backend/src/index.js

      - name: 🚀 Deploy Standalone Portal & Worker to Cloudflare
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME || 'raipur-land-portal' }}
          LIVE_PORTAL_URL: ${{ secrets.LIVE_PORTAL_URL || 'https://raipur-land-portal.raipur-land.workers.dev' }}
        run: |
          python deploy_to_cloudflare.py --apply
